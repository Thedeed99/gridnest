name: Test and publish Gridnest
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: ems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ems/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package version
        id: version
        run: node --input-type=module -e "import fs from 'node:fs'; console.log('version=' + JSON.parse(fs.readFileSync('package.json')).version);" >> "$GITHUB_OUTPUT"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (process.env.RELEASE_TAG !== 'v' + p.version) process.exit(1);"

  smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ems
          platforms: ${{ matrix.platform }}
          load: true
          tags: gridnest-smoke:local
          build-args: BUILD_VERSION=${{ needs.test.outputs.version }}
      - name: Run isolated demo container
        run: docker run -d --name gridnest-smoke --platform ${{ matrix.platform }} -e DEMO_MODE=true -p 127.0.0.1:8080:8080 gridnest-smoke:local
      - name: Check health and disabled hardware control
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health | jq -e '.status == "ok"'
          curl --fail http://127.0.0.1:8080/api/bootstrap | jq -e '.demo == true and .controlStatus.activeAllowed == false and .thermal.mode == "off"'
          docker exec gridnest-smoke sh -c "grep -Eq '^Uid:[[:space:]]+1000' /proc/1/status"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs gridnest-smoke || true
          docker rm -f gridnest-smoke || true

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Sign in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ems
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ needs.test.outputs.version }}
          sbom: true
          provenance: mode=max