<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17694d">
    <title>Gridnest</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="./"><span class="brand-icon"><i data-lucide="house-plug"></i></span><span>Gridnest</span></a>
        <nav id="main-navigation" aria-label="Hoofdnavigatie">
          <button type="button" data-view="overview" aria-current="page"><i data-lucide="activity"></i>Overzicht</button>
          <button type="button" data-view="thermal"><i data-lucide="thermometer"></i>Warmte</button>
          <button type="button" data-view="rules"><i data-lucide="list-checks"></i>Stroom</button>
          <button type="button" data-view="ev" hidden><i data-lucide="car"></i>Laadpaal</button>
          <button type="button" data-view="battery" hidden><i data-lucide="battery-charging"></i>Accu</button>
          <button type="button" data-view="solar" hidden><i data-lucide="sun"></i>Zonnepanelen</button>
          <button type="button" data-view="entities"><i data-lucide="link"></i>Koppelingen</button>
          <button type="button" data-view="preferences"><i data-lucide="sliders-horizontal"></i>Mijn wensen</button>
        </nav>
        <div class="sidebar-bottom"><span class="status-dot"></span><span>Lokale opslag</span><small id="mode-label">v0.1 · Regels uit</small></div>
      </aside>
      <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="Navigatiemenu sluiten" hidden></button>
      <div class="workspace">
        <header class="topbar"><span id="connection" role="status">Verbinding controleren...</span><div class="topbar-actions"><button id="mobile-menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Navigatiemenu openen" aria-controls="main-navigation" aria-expanded="false"><i data-lucide="menu"></i></button><button id="theme-toggle" class="icon-button" type="button" aria-label="Donkere modus inschakelen" title="Donkere modus inschakelen"><i data-lucide="moon"></i></button><button id="refresh" class="icon-button" type="button" title="Metingen vernieuwen" aria-label="Metingen vernieuwen"><i data-lucide="refresh-cw"></i></button></div></header>
        <main id="main" aria-busy="true"><p>Gegevens ophalen...</p></main>
        <footer><span id="timestamp"></span><span>Europe/Amsterdam</span></footer>
      </div>
    </div>
    <div id="notice" role="status" class="notice" hidden></div>
  </body>
</html>
