<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17694d">
    <title>Gridnest</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <a class="brand" href="./" aria-label="Gridnest"><span class="brand-icon"><i data-lucide="house-plug"></i></span><span class="brand-label">Gridnest</span></a>
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Zijbalk inklappen" title="Zijbalk inklappen" aria-controls="main-navigation" aria-expanded="true"><i data-lucide="menu"></i></button>
        </div>
        <nav id="main-navigation" aria-label="Hoofdnavigatie">
          <button type="button" data-view="overview" aria-current="page" aria-label="Overzicht" title="Overzicht"><i data-lucide="activity"></i><span class="nav-label">Overzicht</span></button>
          <button type="button" data-view="thermal" aria-label="Warmte" title="Warmte"><i data-lucide="thermometer"></i><span class="nav-label">Warmte</span></button>
          <button type="button" data-view="rules" aria-label="Stroom" title="Stroom"><i data-lucide="list-checks"></i><span class="nav-label">Stroom</span></button>
          <button type="button" data-view="ev" aria-label="Laadpaal" title="Laadpaal" hidden><i data-lucide="car"></i><span class="nav-label">Laadpaal</span></button>
          <button type="button" data-view="battery" aria-label="Batterij" title="Batterij" hidden><i data-lucide="battery-charging"></i><span class="nav-label">Batterij</span></button>
          <button type="button" data-view="solar" aria-label="Zonnepanelen" title="Zonnepanelen" hidden><i data-lucide="sun"></i><span class="nav-label">Zonnepanelen</span></button>
          <button type="button" data-view="tariffs" aria-label="Tarieven" title="Tarieven"><i data-lucide="activity"></i><span class="nav-label">Tarieven</span></button>
          <button type="button" data-view="entities" aria-label="Koppelingen" title="Koppelingen"><i data-lucide="link"></i><span class="nav-label">Koppelingen</span></button>
          <button type="button" data-view="preferences" aria-label="Mijn wensen" title="Mijn wensen"><i data-lucide="sliders-horizontal"></i><span class="nav-label">Mijn wensen</span></button>
        </nav>
        <div class="sidebar-bottom"><span class="status-dot"></span><span>Lokale opslag</span><small id="mode-label">v0.1 · Regels uit</small></div>
      </aside>
      <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="Navigatiemenu sluiten" hidden></button>
      <div class="workspace">
        <header class="topbar"><span id="connection" role="status">Verbinding controleren...</span><div class="topbar-actions"><button id="mobile-menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Navigatiemenu openen" aria-controls="main-navigation" aria-expanded="false"><i data-lucide="menu"></i></button><button id="power-unit-toggle" class="icon-button unit-toggle" type="button" aria-label="Watt tonen" title="Schakel kW/W-weergave">kW</button><button id="theme-toggle" class="icon-button" type="button" aria-label="Donkere modus inschakelen" title="Donkere modus inschakelen"><i data-lucide="moon"></i></button><button id="refresh" class="icon-button" type="button" title="Metingen vernieuwen" aria-label="Metingen vernieuwen"><i data-lucide="refresh-cw"></i></button></div></header>
        <main id="main" aria-busy="true"><p>Gegevens ophalen...</p></main>
        <footer><span id="timestamp"></span><span>Europe/Amsterdam</span></footer>
      </div>
    </div>
    <div id="notice" role="status" class="notice" hidden></div>
  </body>
</html>
